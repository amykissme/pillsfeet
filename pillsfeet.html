<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pillsfeet</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#000;--s1:#1c1c1e;--s2:#2c2c2e;--tx:#f5f5f7;--tx2:#8e8e93;--ac:#8b95ff;--ok:#32d74b;--r:20px;
--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Pixelify Sans',ui-monospace,Menlo,monospace;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#views{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 24px;opacity:0;pointer-events:none;transform:translateX(40px);transition:transform .45s var(--ease),opacity .35s ease}
.view.active{opacity:1;pointer-events:auto;transform:none}
.view.left{transform:translateX(-40px)}
h1{font-size:34px;font-weight:600;letter-spacing:.5px}
.sub{color:var(--tx2);font-size:16px;margin-top:4px}
.card{background:var(--s1);border-radius:var(--r);padding:18px}
/* tabs */
nav{position:relative;display:flex;margin:0 16px calc(env(safe-area-inset-bottom,0px) + 10px);padding:6px;background:rgba(44,44,46,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:26px}
nav .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);background:var(--s1);border-radius:20px;transition:transform .45s var(--ease);box-shadow:0 0 0 1px rgba(255,255,255,.06)}
nav button{position:relative;flex:1;background:none;border:0;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx2);font-size:12px;transition:color .3s}
nav button.on{color:var(--tx)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* exercises */
.total{margin:22px 0 14px;text-align:center;padding:26px 18px}
.total .t{font-size:56px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:2px}
.total .l{color:var(--tx2);font-size:15px;margin-top:2px}
.bar{height:6px;background:var(--s2);border-radius:3px;margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:3px;transition:width .5s var(--ease)}
.item{display:flex;align-items:center;gap:14px;margin-top:10px;padding:14px 14px 14px 18px;transition:transform .2s,box-shadow .3s}
.item.run{box-shadow:0 0 0 1.5px var(--ac)}
.item .n{flex:1}
.item .n b{display:block;font-size:19px;font-weight:500}
.item .n span{color:var(--tx2);font-size:14px}
.btn{border:0;border-radius:16px;padding:11px 18px;background:var(--s2);font-size:16px;min-width:96px;cursor:pointer;transition:transform .15s,background .3s,opacity .3s}
.btn:active{transform:scale(.94)}
.btn.go{background:var(--ac);color:#000;font-weight:600}
.btn.fin{background:var(--tx);color:#000;font-weight:600}
.btn.ok{background:rgba(50,215,75,.15);color:var(--ok)}
.btn:disabled{opacity:.35}
/* report */
.date{font-size:30px;margin-top:22px;line-height:1.15;text-transform:capitalize}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-top:22px;height:300px;border:1.5px dashed #48484a;border-radius:var(--r);color:var(--tx2);cursor:pointer;overflow:hidden;position:relative;transition:border-color .3s}
.drop:active{border-color:var(--ac)}
.drop svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:pop .45s var(--ease)}
.main{width:100%;margin-top:16px;padding:16px;font-size:18px;border-radius:18px}
.note{color:var(--tx2);text-align:center;font-size:14px;margin-top:12px;min-height:18px}
.done-box{margin-top:22px;padding:0;overflow:hidden}
.done-box img{width:100%;height:300px;object-fit:cover;display:block}
.done-box div{padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.ok-t{color:var(--ok)}
/* profile */
.who{display:flex;align-items:center;gap:16px;margin-top:22px}
.ava{width:68px;height:68px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:30px;font-weight:600;color:var(--ac)}
.nm{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.who input{background:none;border:0;outline:0;font-size:26px;font-weight:600;min-width:0;max-width:100%;width:8ch}
.badge{flex-shrink:0;padding:3px 12px 4px;border:1.5px solid #8957e5;border-radius:999px;color:#a371f7;font-size:15px;font-weight:500;line-height:1.3}
.who input::placeholder{color:#48484a}
h2{font-size:20px;font-weight:500;margin:30px 0 4px;color:var(--tx2)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:16px 18px;cursor:pointer;width:100%;border:0;text-align:left;transition:transform .15s}
.row:active{transform:scale(.98)}
.row em{font-style:normal;color:var(--tx2)}
.empty{color:var(--tx2);text-align:center;padding:30px 10px;font-size:16px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .35s}
#sheet.open{opacity:1;pointer-events:auto}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;background:var(--s1);border-radius:28px 28px 0 0;padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(100%);transition:transform .5s var(--ease)}
#sheet.open .pane{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 14px}
.pane img{width:100%;max-height:52vh;object-fit:cover;border-radius:18px;display:block}
.pane .meta{display:flex;justify-content:space-between;margin-top:14px;font-size:18px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-80px);background:var(--s2);padding:11px 20px;border-radius:18px;z-index:9;transition:transform .5s var(--ease);font-size:16px}
.toast.show{transform:translate(-50%,0)}
/* lock */
nav button{transition:color .3s,opacity .4s}
nav.locked button:not([data-i="1"]){opacity:.3}
.lockmsg{display:grid;place-items:center;margin-top:22px;height:300px;text-align:center;padding:24px;color:var(--tx2);font-size:18px;line-height:1.3}
.lockmsg svg{width:36px;height:36px;stroke:var(--tx2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px}
/* changes */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.fig{padding:0;overflow:hidden;animation:pop .5s var(--ease)}
.fig .ph{width:100%;aspect-ratio:3/4;object-fit:cover;display:grid;place-items:center;background:var(--s2);color:var(--tx2);text-align:center;font-size:14px;padding:12px}
.fig .cp{padding:12px 14px 14px}
.fig .cp b{display:block;font-size:17px;font-weight:500}
.fig .cp span{color:var(--tx2);font-size:14px}
.days{text-align:center;margin-top:18px;color:var(--tx2);font-size:16px}
/* registration */
#reg{position:fixed;inset:0;z-index:25;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .5s ease,transform .6s var(--ease)}
#reg.show{display:flex}
#reg.out{opacity:0;transform:translateY(30px);pointer-events:none}
#reg h1{font-size:32px}
.rp{position:relative;width:210px;height:280px;border-radius:28px;margin:24px 0 8px;border:1.5px dashed #48484a;display:grid;place-items:center;color:var(--tx2);cursor:pointer;overflow:hidden;transition:border-color .3s}
.rp svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:pop .45s var(--ease)}
.step{display:none;flex-direction:column;align-items:center;width:100%}
.step.on{display:flex;animation:stepin .5s var(--ease)}
@keyframes stepin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.rin{width:100%;max-width:320px;background:var(--s1);border:0;outline:0;border-radius:16px;padding:15px 18px;font-size:20px;text-align:center}
.rin::placeholder{color:#636366}
#reg .btn{width:100%;max-width:320px;margin-top:14px;padding:15px;font-size:18px}
.mot{min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;line-height:1.25;color:var(--ac);opacity:0;transition:opacity .4s;margin-bottom:6px}
.mot.on{opacity:1}
.ava{position:relative;overflow:hidden}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* splash */
#splash{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center;transition:opacity .6s ease,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.pillwrap{position:relative;width:180px;height:180px;display:grid;place-items:center}
.ring{position:absolute;width:110px;height:110px;border-radius:50%;border:1px solid rgba(255,255,255,.35);opacity:0;animation:ring 2s ease-out infinite}
.ring.b{animation-delay:1s}
.capsule{position:relative;width:54px;height:128px;border-radius:30px;background:#fff;transform:rotate(40deg);overflow:hidden;animation:beat 2s cubic-bezier(.45,0,.25,1) infinite;box-shadow:0 0 40px rgba(255,255,255,.25)}
.capsule::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#000;opacity:.9}
.capsule::after{content:"";position:absolute;left:9px;top:12px;width:7px;height:34px;border-radius:4px;background:rgba(0,0,0,.08)}
.sp-t{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);left:0;right:0;text-align:center;font-size:22px;letter-spacing:3px;opacity:0;animation:fadein 1s ease .8s forwards}
@keyframes beat{0%,100%{transform:rotate(40deg) scale(.94);box-shadow:0 0 24px rgba(255,255,255,.12)}50%{transform:rotate(40deg) scale(1.06);box-shadow:0 0 70px rgba(255,255,255,.4)}}
@keyframes ring{0%{transform:scale(.7);opacity:.5}100%{transform:scale(2);opacity:0}}
@keyframes fadein{to{opacity:.9}}
@keyframes pop{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<div id="splash"><div class="pillwrap"><i class="ring"></i><i class="ring b"></i><div class="capsule"></div></div><div class="sp-t">Pillsfeet</div></div>
<div id="reg">
  <div class="step on" id="st1">
    <h1>Добро пожаловать</h1>
    <p class="sub">Как тебя зовут?</p>
    <input class="rin" id="rname" placeholder="Твоё имя" maxlength="24" autocomplete="off" style="margin-top:28px">
    <button class="btn go" id="rnext" disabled>Далее</button>
  </div>
  <div class="step" id="st2">
    <h1>Фото первого дня</h1>
    <p class="sub">Оно станет точкой отсчёта во вкладке «Изменения»</p>
    <label class="rp" id="rp"><input type="file" accept="image/*" id="rfile" hidden><svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.3-2h6l1.3 2h1.2A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12.5" cy="12.5" r="3.5"/></svg></label>
    <button class="btn go" id="rgo" disabled>Начать</button>
    <div class="note" id="rnote"></div>
  </div>
</div>
<div id="app">
  <div id="views">
    <section class="view active" id="v0">
      <h1>Pillsfeet</h1>
      <p class="sub">Упражнения на сегодня</p>
      <div class="card total"><div class="mot" id="mot"></div><div class="t" id="tot">00:00</div><div class="l">общее время</div><div class="bar"><i id="bar"></i></div></div>
      <div id="list"></div>
    </section>
    <section class="view" id="v1">
      <h1>Отчёт</h1>
      <div class="date" id="today"></div>
      <div id="rep"></div>
    </section>
    <section class="view" id="v2">
      <h1>Профиль</h1>
      <div class="who"><div class="ava" id="ava">?</div><div class="nm"><input id="name" placeholder="Твоё имя" maxlength="24" autocomplete="off"><span class="badge">моггер</span></div></div>
      <p class="sub" id="since" style="margin-top:12px"></p>
      <h2>История</h2>
      <div id="hist"></div>
    </section>
    <section class="view" id="v3">
      <h1>Изменения</h1>
      <p class="sub">Первый день и последний отчёт</p>
      <div id="chg"></div>
    </section>
  </div>
  <nav id="nav">
    <div class="pill" id="pill"></div>
    <button class="on" data-i="0"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Упражнения</button>
    <button data-i="1"><svg viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.3-2h6l1.3 2h1.2A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>Отчёт</button>
    <button data-i="2"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/></svg>Профиль</button>
    <button data-i="3"><svg viewBox="0 0 24 24"><path d="M4 7h11M4 12h16M4 17h11"/><path d="m17 5 3 2-3 2"/><path d="m7 15-3 2 3 2"/></svg>Изменения</button>
  </nav>
</div>
<div id="sheet"><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"></div>

<script>
const TG = window.Telegram && Telegram.WebApp;
try { TG && (TG.ready(), TG.expand(), TG.setHeaderColor && TG.setHeaderColor('#000000'), TG.setBackgroundColor && TG.setBackgroundColor('#000000')); } catch(e){}

const TASKS = [
  {t:'Упражнения для лица', s:'Выполни в приложении'},
  {t:'Массаж лица', s:'Лёгкие движения по линиям'},
  {t:'Отжимания', s:'Столько, сколько можешь'},
  {t:'Умыться', s:'Прохладная вода'}
];
const KEY = 'pillsfeet_v1';
let S = {name:'', start:null, sessions:{}, reports:{}};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch(e){ return false; } };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const dkey = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt = s => { s = Math.max(0, Math.floor(s)); return pad(Math.floor(s/60))+':'+pad(s%60); };
const longDate = k => new Date(k+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const shortDate = k => new Date(k+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});

if (!S.start) S.start = dkey();
if (!S.name && TG && TG.initDataUnsafe && TG.initDataUnsafe.user) S.name = TG.initDataUnsafe.user.first_name || '';
save();

let run = null; // {i, t0}
const sess = () => { const k = dkey(); return S.sessions[k] || (S.sessions[k] = {times:[null,null,null,null], total:0, complete:false}); };
const liveTotal = () => sess().times.reduce((a,b)=>a+(b||0),0) + (run ? (Date.now()-run.t0)/1000 : 0);

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- tabs ---------- */
let cur = 0;
const locked = () => sess().complete && !S.reports[dkey()];
function updateLock(){
  const l = locked();
  $('nav').classList.toggle('locked', l);
  try { TG && (l ? TG.enableClosingConfirmation() : TG.disableClosingConfirmation()); } catch(e){}
}
function go(i){
  if (locked() && i!==1){ toast('Сначала загрузи фото отчёта'); try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('warning'); } catch(e){} return; }
  if (i===cur) return;
  document.querySelectorAll('.view').forEach((v,n)=>{
    v.classList.toggle('active', n===i);
    v.classList.toggle('left', n<i);
  });
  document.querySelectorAll('nav button').forEach((b,n)=>b.classList.toggle('on', n===i));
  $('pill').style.transform = 'translateX('+(i*100)+'%)';
  cur = i;
  if (i===1) renderReport();
  if (i===2) renderProfile();
  if (i===3) renderChanges();
  try { TG && TG.HapticFeedback && TG.HapticFeedback.selectionChanged(); } catch(e){}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
document.querySelectorAll('.view').forEach((v,n)=>{ if(n>0) v.classList.add('left'); v.classList.toggle('left', n<0); });
document.querySelectorAll('.view').forEach((v,n)=>{ v.classList.remove('left'); });

/* ---------- exercises ---------- */
const PH = ['Хорошее начало, продолжай','Каждое движение считается','Дыши ровно, не торопись','Ты делаешь это для себя','Маленькие шаги дают результат','Держи темп, у тебя получается','Постоянство сильнее настроения','Ещё немного, ты уже в процессе','Гордись тем, что начал','Сегодняшний ты скажет спасибо'];
let phI = Math.floor(Math.random()*PH.length), phT = null;
function showPhrase(){ const m=$('mot'); m.classList.remove('on'); setTimeout(()=>{ m.textContent = PH[phI++ % PH.length]; m.classList.add('on'); }, 400); }
function startMot(){ showPhrase(); phT = setInterval(showPhrase, 8000); }
function renderList(){
  const s = sess(), box = $('list');
  box.innerHTML = '';
  TASKS.forEach((k,i)=>{
    const d = s.times[i] != null, running = run && run.i===i;
    const el = document.createElement('div');
    el.className = 'card item' + (running ? ' run' : '');
    const state = d ? '<button class="btn ok" disabled>✓ '+fmt(s.times[i])+'</button>'
      : running ? '<button class="btn fin" data-a="fin" data-i="'+i+'"><span id="lt">00:00</span> Готово</button>'
      : '<button class="btn go" data-a="start" data-i="'+i+'"'+(run?' disabled':'')+'>Начать</button>';
    el.innerHTML = '<div class="n"><b>'+k.t+'</b><span>'+k.s+'</span></div>'+state;
    box.appendChild(el);
  });
  const started = run || s.times.some(x=>x!=null);
  if (s.complete){ clearInterval(phT); phT=null; const m=$('mot'); m.textContent='Ты молодец, осталось отправить отчёт'; m.classList.add('on'); }
  else if (started && !phT) startMot();
  tick();
}
$('list').onclick = e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const i = +b.dataset.i, s = sess();
  if (b.dataset.a==='start' && !run){ run = {i, t0:Date.now()}; renderList(); }
  else if (b.dataset.a==='fin' && run){
    s.times[i] = Math.round((Date.now()-run.t0)/1000) || 1; run = null;
    s.total = s.times.reduce((a,b)=>a+(b||0),0);
    if (s.times.every(x=>x!=null)){
      s.complete = true; save(); updateLock(); renderList();
      toast('Всё готово · '+fmt(s.total));
      try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
      setTimeout(()=>go(1), 900);
      return;
    }
    save(); renderList();
  }
};
function tick(){
  const s = sess();
  $('tot').textContent = fmt(liveTotal());
  const done = s.times.filter(x=>x!=null).length;
  $('bar').style.width = (done/TASKS.length*100)+'%';
  const lt = $('lt'); if (lt && run) lt.textContent = fmt((Date.now()-run.t0)/1000);
}
setInterval(tick, 250);

/* ---------- report ---------- */
let photo = null;
async function decode(file){
  if (window.createImageBitmap){ try { return await createImageBitmap(file, {imageOrientation:'from-image'}); } catch(e){ try { return await createImageBitmap(file); } catch(e2){} } }
  const load = src => new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; });
  const url = URL.createObjectURL(file);
  try { return await load(url); }
  catch(e){
    const data = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
    return await load(data);
  } finally { URL.revokeObjectURL(url); }
}
async function compress(file,m=900){
  const img = await decode(file);
  const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
  if (!w || !h) throw new Error('empty');
  const r = Math.min(1, m/Math.max(w,h));
  const c = document.createElement('canvas'); c.width = Math.max(1,Math.round(w*r)); c.height = Math.max(1,Math.round(h*r));
  const x = c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,c.width,c.height);
  x.drawImage(img,0,0,c.width,c.height);
  if (img.close) img.close();
  return c.toDataURL('image/jpeg',.75);
}
function renderReport(){
  const k = dkey(), r = S.reports[k], s = sess();
  $('today').textContent = longDate(k);
  const box = $('rep');
  if (r){
    box.innerHTML = '<div class="card done-box"><img src="'+r.photo+'" alt=""><div><span class="ok-t">Отчёт отправлен</span><span>'+fmt(r.total)+'</span></div></div>';
    return;
  }
  if (!s.complete){
    box.innerHTML = '<div class="card lockmsg"><div><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><div>Вы попадёте сюда после выполнения упражнений</div></div></div>';
    return;
  }
  box.innerHTML = '<label class="drop" id="drop"><input type="file" accept="image/*" id="file" hidden>'+
    '<svg viewBox="0 0 24 24"><path d="M12 16V5M7.5 9.5 12 5l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span>Загрузить фото</span></label>'+
    '<button class="btn go main" id="send">Подтвердить отчёт</button><div class="note" id="note"></div>';
  if (photo) showPhoto();
  upd();
  $('file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { photo = await compress(f); showPhoto(); upd(); } catch(err){ $('note').textContent = 'Формат фото не поддерживается, попробуй скриншот или JPG'; }
  };
  $('send').onclick = () => {
    if (!photo || !s.complete) return;
    S.reports[k] = {photo, total:s.total};
    if (!save()){ delete S.reports[k]; toast('Не хватило памяти, попробуй другое фото'); return; }
    photo = null; updateLock(); renderReport(); renderProfile();
    toast('Отчёт сохранён');
    try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
  };
}
function showPhoto(){ const d=$('drop'); d.querySelector('img') && d.querySelector('img').remove(); const im=new Image(); im.src=photo; d.appendChild(im); }
function upd(){
  const s = sess(), b = $('send'); if (!b) return;
  b.disabled = !(photo && s.complete);
  $('note').textContent = !s.complete ? 'Сначала выполни все упражнения' : !photo ? 'Добавь фото, чтобы подтвердить' : '';
}

/* ---------- changes ---------- */
function renderChanges(){
  const keys = Object.keys(S.reports).sort(), lk = keys[keys.length-1], last = lk && S.reports[lk];
  const days = Math.max(1, Math.round((new Date(dkey()+'T12:00:00') - new Date(S.start+'T12:00:00'))/864e5) + 1);
  const fig = (img, title, sub, empty) => '<div class="card fig">'+(img ? '<img class="ph" src="'+img+'" alt="">' : '<div class="ph">'+empty+'</div>')+'<div class="cp"><b>'+title+'</b><span>'+sub+'</span></div></div>';
  $('chg').innerHTML = '<div class="cmp">'+
    fig(S.first || S.avatar, 'Первый день', shortDate(S.start), 'Нет фото')+
    fig(last && last.photo, 'Последний день', lk ? shortDate(lk) : 'ждём отчёт', 'Появится после первого отчёта')+
  '</div><div class="days">'+days+' '+(days%10===1&&days%100!==11?'день':(days%10>=2&&days%10<=4&&(days%100<10||days%100>=20)?'дня':'дней'))+' в пути</div>';
}

/* ---------- profile ---------- */
function setAva(){ const a=$('ava'); const ph = S.first || S.avatar; a.textContent = ph ? '' : (S.name.trim()[0] || '?').toUpperCase(); if(ph){ const im=new Image(); im.src=ph; a.appendChild(im);} }
const fit = () => { const n=$('name'); n.style.width = Math.max(n.value.length, 8)+'ch'; };
function renderProfile(){
  $('name').value = S.name; fit();
  setAva();
  $('since').textContent = 'С нами с '+shortDate(S.start);
  const keys = Object.keys(S.reports).sort().reverse(), h = $('hist');
  h.innerHTML = keys.length ? '' : '<div class="empty">Пока пусто. Первый отчёт появится здесь.</div>';
  keys.forEach(k=>{
    const b = document.createElement('button');
    b.className = 'card row'; b.innerHTML = '<span>'+shortDate(k)+'</span><em>'+fmt(S.reports[k].total)+'</em>';
    b.onclick = () => openSheet(k);
    h.appendChild(b);
  });
}
$('name').oninput = e => { fit(); S.name = e.target.value; setAva(); save(); };
function openSheet(k){
  const r = S.reports[k];
  $('pane').innerHTML = '<div class="grab"></div><img src="'+r.photo+'" alt=""><div class="meta"><span>'+shortDate(k)+'</span><span>'+fmt(r.total)+'</span></div>';
  $('sheet').classList.add('open');
}
$('sheet').onclick = e => { if (e.target.id==='sheet') $('sheet').classList.remove('open'); };

/* ---------- registration ---------- */
let rPhoto = null;
const r1 = () => { $('rnext').disabled = !$('rname').value.trim(); };
if (!S.reg){ $('reg').classList.add('show'); $('rname').value = S.name || ''; r1(); }
$('rname').oninput = r1;
$('rname').onkeydown = e => { if (e.key==='Enter') $('rnext').click(); };
$('rnext').onclick = () => {
  if ($('rnext').disabled) return;
  $('st1').classList.remove('on'); $('st2').classList.add('on');
};
$('rfile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    rPhoto = await compress(f, 900);
    const old=$('rp').querySelector('img'); old && old.remove();
    const im=new Image(); im.src=rPhoto; $('rp').appendChild(im);
    $('rgo').disabled = false; $('rnote').textContent = '';
  } catch(err){ $('rnote').textContent = 'Формат фото не поддерживается, попробуй скриншот или JPG'; }
};
$('rgo').onclick = () => {
  if ($('rgo').disabled || !rPhoto) return;
  S.name = $('rname').value.trim(); S.first = rPhoto; delete S.avatar; S.reg = true; S.start = dkey();
  if (!save()){ toast('Не хватило памяти, выбери другое фото'); S.reg = false; return; }
  renderProfile();
  $('reg').classList.add('out'); setTimeout(()=>$('reg').remove(), 700);
  try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred('success'); } catch(e){}
};

renderList();
updateLock();
if (locked()) go(1);
setTimeout(()=>{ $('splash').classList.add('out'); setTimeout(()=>$('splash').remove(),700); }, 3600);
</script>
